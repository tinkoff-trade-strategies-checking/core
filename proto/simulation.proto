// Контракт gRPC между Java (simulation) и C++ (Simulation Worker).
// Источник правды для обеих сторон. Меняя файл, обнови architecture.md и уведоми backend.
//
// Деньги и цены — Decimal из common.proto (`decisions.md`, «Деньги в C++»); double только в метриках (INV-6).
// Количество — целые лоты. Объём бара — в лотах.
//
// Ошибки RPC:
//   INVALID_ARGUMENT    — неверная спецификация;
//   FAILED_PRECONDITION — нет данных снапшота или инструмента, либо параметры
//                         инструмента (lot_size/price_step) не совпадают со
//                         снапшотом (securities);
//   NOT_FOUND           — запрошенный интервал недоступен;
//   UNAVAILABLE         — хранилище данных недоступно;
//   INTERNAL            — нарушение целостности движка или повреждённые данные.
// ВНИМАНИЕ (INV-7): Status.message может содержать тикеры и даты для диагностики
// и логов backend — в слепом режиме текст статуса клиенту не передаётся.
//
// Сентинелы: в полях-идентификаторах и шагах «нет» кодируется -1 (значение по умолчанию 0 — валидное: заявка с
// id 0, шаг 0). Так в Order.oco_sibling_id и Order.closed_step; получатель считает «есть» только значение >= 0.
syntax = "proto3";

package pac.simulation.v1;

option java_package = "pac.simulation.v1";
option java_multiple_files = true;

import "common.proto";  // Decimal

service SimulationWorker {
  // Проверка доступности воркера и версии ядра.
  rpc Ping(PingRequest) returns (PingResponse);
  // Воспроизведение сессии по журналу команд до курсора (INV-8).
  rpc ReplaySession(ReplaySessionRequest) returns (ReplaySessionResponse);
  // Бары по диапазону шагов общей шкалы времени сессии.
  rpc GetBars(GetBarsRequest) returns (GetBarsResponse);
  // Оценка заявки по close последнего бара до курсора (без изменения журнала, INV-1, INV-8).
  rpc EstimateOrder(EstimateOrderRequest) returns (EstimateOrderResponse);
  // Классификация исторических периодов по волатильности и просадке IMOEX (`decisions.md`, «Стресс-сценарии»).
  rpc ClassifyPeriods(ClassifyPeriodsRequest) returns (ClassifyPeriodsResponse);
  // Статическая проверка и линтер стратегии на DSL (`dsl.md`).
  rpc CheckStrategy(CheckStrategyRequest) returns (CheckStrategyResponse);
  // Детерминированный прогон DSL-стратегии на истории с прогрессом (UC-14, UC-18, INV-3, INV-4).
  rpc RunStrategy(RunStrategyRequest) returns (stream RunStrategyUpdate);
}

message PingRequest {}

message PingResponse {
  // Версия Simulation Core, с которой собран воркер.
  string core_version = 1;
}

// ---------------------------------------------------------------------------
// Перечисления
// ---------------------------------------------------------------------------

enum Timeframe {
  TIMEFRAME_UNSPECIFIED = 0;
  reserved 1, 2;
  reserved "S1", "S10";
  M1 = 3;
  M5 = 4;
  M10 = 5;
  M15 = 6;
  H1 = 7;
  D1 = 8;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  MARKET = 1;
  LIMIT = 2;
  STOP = 3;
  STOP_LIMIT = 4;
  TAKE_PROFIT = 5;
  TRAILING_STOP = 6;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  DAY = 1;
  GTC = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  PARTIALLY_FILLED = 2;
  FILLED = 3;
  CANCELLED = 4;
  EXPIRED = 5;
  REJECTED = 6;
}

// Причина отказа в заявке или снятия заявки.
enum Reason {
  REASON_UNSPECIFIED = 0;
  INVALID_PARAMS = 1;
  INSUFFICIENT_CASH = 2;
  INSUFFICIENT_POSITION = 3;
  SESSION_NOT_ACTIVE = 4;
  ORDER_NOT_ACTIVE = 5;
  LIQUIDITY_LIMIT = 6;
  OCO_SIBLING_FILLED = 7;
  POSITION_CLOSED = 8;
  REPLACED = 9;
  SESSION_END = 10;
  CANCELLED_BY_USER = 11;
  reserved 12;
  reserved "RULE_REPLACED";
  DAY_EXPIRED = 13;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  RUNNING = 1;
  FINISHED_END = 2;
  BANKRUPT = 3;
}

// Уровень статической и рантайм-диагностики стратегии (`dsl.md`, ФТ-14).
enum Level {
  LEVEL_UNSPECIFIED = 0;
  OK = 1;
  WARNING = 2;
  ERROR = 3;
}

// ---------------------------------------------------------------------------
// Данные и условия: снапшот, бумаги, период, шаг, издержки, капитал
// ---------------------------------------------------------------------------

message Instrument {
  string key = 1;       // ключ бумаги в сессии
  string ticker = 2;
  int64 lot_size = 3;   // штук в одном лоте
  Decimal price_step = 4;
}

message CostConfig {
  Decimal commission_rate = 1;
  Decimal exchange_fee_rate = 2;
  Decimal spread = 3;
  Decimal slippage_kappa = 4;
  Decimal liquidity_share = 5;
}

message MarketSpec {
  string snapshot_id = 1;               // UUID снапшота ClickHouse
  repeated Instrument instruments = 2;  // порядок = порядок обработки
  Timeframe timeframe = 3;
  string from_date = 4;                 // ISO yyyy-mm-dd, включительно, московская дата
  string to_date = 5;
  CostConfig costs = 6;
  Decimal initial_cash = 7;
  string benchmark_ticker = 8;          // "IMOEX" или пусто
  // Прогрев: столько шагов истории до from_date (0…5000; 0 — без прогрева). Торговли и кривой стоимости на них нет;
  // человек видит их на графике с самого начала (это прошлое, INV-1).
  // Шаги прогрева — отрицательные (-W…-1), торговые дни — <= 0. Историю ищут не дальше ~20 лет до from_date; найдено
  // меньше W баров — берётся сколько есть (фактическое число — warmup_steps в ответах).
  int32 warmup_bars = 10;
  reserved 9;
  reserved "naive";
}

message Bar {
  int64 step = 1;               // номер в общей шкале времени сессии; < 0 — бар прогрева (MarketSpec.warmup_bars)
  string instrument_key = 2;
  int64 time_unix_ms = 3;       // начало бара
  int32 trading_day = 4;        // с 1; у баров прогрева <= 0 (последний день истории — 0)
  Decimal open = 5;
  Decimal high = 6;
  Decimal low = 7;
  Decimal close = 8;
  int64 volume_lots = 9;
  bool after_halt = 10;         // первый бар после разрыва торгов
}

// ---------------------------------------------------------------------------
// Журнал команд (INV-8)
// ---------------------------------------------------------------------------

message OrderSpec {
  string instrument_key = 1;
  Side side = 2;
  OrderType type = 3;
  int64 lots = 4;
  Decimal limit_price = 5;
  Decimal stop_price = 6;
  Decimal trailing_percent = 7;
  TimeInForce time_in_force = 8;
  // Если true — limit_price и stop_price заданы в слепой шкале (от 100).
  // Допустимо только в EstimateOrderRequest.order: EstimateOrder переводит
  // цены в рубли и возвращает рублёвую заявку в EstimateOrderResponse.resolved_order.
  // Журнал (ReplaySession) хранит только рублёвые цены; команда с is_blind_price = true
  // в журнале отклоняется (Rejected, INVALID_PARAMS, поле "isBlindPrice").
  bool is_blind_price = 9;
}

message PlaceOrder {
  OrderSpec order = 1;
  OrderSpec oco_with = 2;   // пустой (lots = 0) — без OCO
}

message CancelOrder {
  int64 order_id = 1;
  // Причина снятия: не задана — отмена пользователем (CANCELLED_BY_USER).
  Reason reason = 2;
}

message ReplaceOrder {
  int64 order_id = 1;
  PlaceOrder replacement = 2;
}

message JournalEntry {
  int64 seq = 1;
  int64 step = 2;   // команда действует с шага step + 1 (INV-2)
  oneof command {
    PlaceOrder place = 3;
    CancelOrder cancel = 4;
    ReplaceOrder replace = 5;
  }
  string rule_name = 6; // имя правила стратегии, породившего команду; пусто для ручной торговли
  string because = 7;   // причина действия правила (`because` из DSL)
}

// ---------------------------------------------------------------------------
// Состояние
// ---------------------------------------------------------------------------

message Order {
  int64 id = 1;                   // seq * 2 + leg
  OrderSpec spec = 2;
  int64 placed_step = 3;
  OrderStatus status = 4;
  Reason reason = 5;
  string invalid_field = 6;
  int64 filled_lots = 7;
  int64 oco_sibling_id = 8;       // -1 — нет связанной заявки
  string rule_name = 9;           // имя правила стратегии; пусто для ручных заявок
  string because = 10;            // причина заявки из правила стратегии
  Decimal trailing_stop_level = 11;
  int64 closed_step = 12;         // -1 — заявка ещё открыта
}

// Изменение цены бумаги на курсоре, % (×100, 2 знака HALF_UP), только по барам <= курсора (INV-1).
message InstrumentChange {
  string instrument_key = 1;
  optional Decimal step_pct = 2;    // close бара на курсоре к close предыдущего (нет предыдущего — к open); не задано, если на курсоре у бумаги нет бара
  optional Decimal period_pct = 3;  // close последнего бара к open первого бара сессии
}

message Fill {
  int64 order_id = 1;
  int64 step = 2;
  string instrument_key = 3;
  Side side = 4;
  int64 lots = 5;
  Decimal price = 6;
  Decimal base_price = 7;
  Decimal value = 8;
  Decimal commission = 9;
  Decimal exchange_fee = 10;
  bool stop_and_take_same_bar = 11;   // стоп и тейк в одной свече: сработал стоп, сделка помечена
  Decimal spread_cost = 12;
  Decimal slippage_cost = 13;
  // Производные величины (core#54), считает core, backend не складывает.
  int64 seq = 14;          // порядковый номер сделки в журнале сессии, с 0; стабилен между перепроигрываниями (id v5 у backend)
  Decimal cost = 15;       // издержки сделки: commission + exchange_fee + spread_cost + slippage_cost, ₽
  Decimal cost_pct = 16;   // cost в % начального капитала, 2 знака HALF_UP (от рублёвой суммы, не от округлённых процентов)
  Decimal amount_pct = 17; // value в % начального капитала, 2 знака HALF_UP
}

message Position {
  string instrument_key = 1;
  int64 lots = 2;
  Decimal avg_price = 3;
  Decimal market_value = 4;
  // Проценты (core#54), ×100, 2 знака HALF_UP; база — начальный капитал (как BlindPosition).
  Decimal value_pct = 5;   // market_value / initial_cash
  Decimal pnl_pct = 6;     // нереализованный P&L: (market_value - себестоимость) / initial_cash; себестоимость — точная сумма покупок открытых лотов (FIFO), без комиссии и сбора
}

message Portfolio {
  Decimal cash = 1;
  Decimal equity = 2;
  repeated Position positions = 3;
  // Проценты (core#54), уже ×100, 2 знака HALF_UP; база всех — начальный капитал (initial_cash).
  // cash_pct + invested_pct = equity_pct ровно: equity_pct и cash_pct округляются один раз от точных значений,
  // invested_pct = equity_pct - cash_pct (может отличаться на 0,01 от прямого округления invested / initial_cash).
  Decimal invested_pct = 4;  // доля вложенного в позиции: equity_pct - cash_pct
  Decimal costs_pct = 5;     // накопленные издержки сделок до этого шага включительно / initial_cash
  Decimal pnl_pct = 6;       // (equity - initial_cash) / initial_cash
  Decimal equity_pct = 7;    // equity / initial_cash
  Decimal cash_pct = 8;      // cash / initial_cash
  // Те же величины в рублях (точные суммы):
  Decimal invested = 9;      // сумма стоимости позиций
  Decimal pnl = 10;          // equity - initial_cash
  Decimal costs = 11;        // накопленные издержки сделок до этого шага включительно
}

message CommandResult {
  int64 seq = 1;
  bool accepted = 2;
  Reason reason = 3;
  string invalid_field = 4;
  repeated int64 order_ids = 5;
}

message StepEvents {
  int64 step = 1;
  repeated Bar bars = 2;
  repeated Fill fills = 3;
  repeated Order changed_orders = 4;
  Portfolio portfolio = 5;
}

// ---------------------------------------------------------------------------
// Отчёт (ФТ-17). optional — значение может отсутствовать (мало данных).
// ---------------------------------------------------------------------------

message Metrics {
  double total_return = 1;
  double gross_return = 2;
  optional double cagr = 3;
  double max_drawdown = 4;
  int64 max_drawdown_steps = 5;
  optional double volatility = 6;
  optional double sharpe = 7;
  optional double sortino = 8;
  double turnover = 9;
  int64 fills = 10;
  int64 round_trips = 11;
  optional double win_rate = 12;
  int64 rejections = 13;
  int64 partial_fills = 14;
  double hhi_avg = 15;
  double max_position_share = 16;
  optional double benchmark_return = 17;
  int32 trading_days = 18;
  int64 max_drawdown_days = 20;    // число разных торговых дней, на которые пришлась самая длинная серия шагов ниже пика (без деления и округления), core#54
  int64 stop_take_same_bar = 19;   // сделок, где стоп и тейк задеты одной свечой (исполнен стоп, INV-3)
}

message CostTotals {
  Decimal commission = 1;
  Decimal exchange_fee = 2;
  Decimal spread = 3;
  Decimal slippage = 4;
  Decimal total = 5;   // сумма четырёх видов, ₽ (core#54); все суммы до копейки, спред и проскальзывание — HALF_UP от точной суммы (core#58)
}

message EquityPoint {
  int64 step = 1;
  Decimal equity = 2;
}

// Пара покупка -> продажа по FIFO (Portfolio::roundTrips()): закрытая часть покупки. Суммы до копейки.
message RoundTrip {
  string instrument_key = 1;
  int64 entry_step = 2;
  int64 exit_step = 3;
  int64 lots = 4;
  Decimal entry_price = 5;   // цена за единицу бумаги
  Decimal exit_price = 6;
  Decimal gross_pnl = 7;     // до издержек: сумма продажи - сумма покупки
  Decimal costs = 8;         // комиссия и сбор обеих сторон (пропорционально лотам пары)
  Decimal net_pnl = 9;       // после издержек
  int64 seq = 10;            // индекс пары в Report.round_trips (с 0; порядок продаж, внутри — покупок), core#54
}

// Диагностическое сообщение времени исполнения (ФТ-14: E-RT01, W-RT01, W-RT02).
message Finding {
  string code = 1;
  Level level = 2;
  string message = 3;
  int64 step = 4; // шаг обнаружения; -1 если относится ко всему прогону
}

message Report {
  Metrics metrics = 1;
  CostTotals costs = 2;
  repeated EquityPoint equity = 3;
  repeated Finding findings = 4;
  Level level = 5;
  Decimal final_equity = 6;
  // Кривая бенчмарка (MarketSpec.benchmark_ticker) в рублях того же капитала: initial_cash * close дня / open первого
  // дня, точка на последнем шаге каждого полностью пройденного торгового дня; до копейки HALF_UP (core#58). Пусто без бенчмарка.
  repeated EquityPoint benchmark_equity = 7;
  // Пары FIFO в порядке продаж, внутри продажи — в порядке покупок (ФТ-20, лист «Сделки» выгрузки).
  repeated RoundTrip round_trips = 8;
  // Кривая просадки (underwater, core#54): по точке на каждую точку `equity`.
  repeated UnderwaterPoint underwater = 9;
}

// Глубина просадки от пика, в процентах (уже ×100): (пик - equity) / пик * 100, >= 0, 2 знака HALF_UP; 0 в пике.
// Пик стартует с initial_cash (как Metrics.max_drawdown). При отрицательном equity значение может превысить 100.
message UnderwaterPoint {
  int64 step = 1;
  Decimal drawdown_pct = 2;
}

// ---------------------------------------------------------------------------
// Слепой режим (`decisions.md`, «Слепой режим», INV-1, INV-6, INV-7):
// без реальных меток времени (только шаг и относительный торговый день) и
// без тикеров/ключей бумаг (только индекс в MarketSpec.instruments).
// ---------------------------------------------------------------------------

message BlindInstrument {
  int32 instrument_index = 1; // индекс бумаги в MarketSpec.instruments (0, 1, ...)
  // Стоимость 1 лота в % от начального капитала по первой показанной свече
  // (шаг <= курсора), 2 знака HALF_UP; не задано до первой свечи.
  // До появления P0 бумага отсутствует в history/events слепого вида целиком.
  optional Decimal lot_value_at_start = 2;
  // Изменение цены на курсоре, % (2 знака HALF_UP, ×100), по барам <= курсора; не задано, пока баров нет (core#54).
  optional Decimal change_step_pct = 3;    // close бара на курсоре к close предыдущего (нет предыдущего — к open); не задано, если на курсоре у бумаги нет бара
  optional Decimal change_period_pct = 4;  // close последнего бара к open первого бара сессии
}

message BlindBar {
  int64 step = 1;             // номер шага (у прогрева отрицательный: -W..-1, у сессии >= 0)
  int32 instrument_index = 2; // индекс бумаги в MarketSpec.instruments (0, 1, ...)
  reserved 3;
  reserved "time_unix_ms";
  int32 trading_day = 4;      // относительный номер торгового дня (у прогрева <= 0)
  Decimal open = 5;           // x * 100 / P0, 2 знака HALF_UP
  Decimal high = 6;
  Decimal low = 7;
  Decimal close = 8;
  Decimal volume_rel = 9;     // 100 * V / V_ref, 2 знака HALF_UP
  bool after_halt = 10;
}

message BlindPosition {
  int32 instrument_index = 1;
  int64 lots = 2;
  Decimal avg_price = 3;         // x * 100 / P0, 2 знака HALF_UP
  Decimal market_value_pct = 4;  // % от начального капитала, 2 знака HALF_UP
  Decimal pnl_pct = 5;           // нереализованный P&L, % начального капитала, 2 знака HALF_UP (core#54)
}

message BlindPortfolio {
  Decimal cash_pct = 1;
  Decimal equity_pct = 2;
  Decimal pnl_pct = 3;
  repeated BlindPosition positions = 4;
  Decimal invested_pct = 5;  // как Portfolio.invested_pct (% начального капитала)
  Decimal costs_pct = 6;     // как Portfolio.costs_pct
}

// Заявка в слепом виде: содержит только поля, требующие маскировки (id,
// instrument_index и масштабированные цены). Сторона, тип, статус, лоты,
// срок действия и placed_step берутся из рублёвого Order
// (ReplaySessionResponse.orders) склейкой по полю id на стороне backend.
message BlindOrder {
  int64 id = 1;
  int32 instrument_index = 2;
  optional Decimal limit_price = 3;
  optional Decimal stop_price = 4;
  optional Decimal trailing_stop_level = 5;
}

message BlindFill {
  int64 order_id = 1;
  int64 step = 2;
  int32 instrument_index = 3;
  Side side = 4;
  int64 lots = 5;
  Decimal price = 6;
  Decimal base_price = 7;
  Decimal value_pct = 8;
  Decimal commission_pct = 9;
  Decimal exchange_fee_pct = 10;
  Decimal spread_cost_pct = 11;
  Decimal slippage_cost_pct = 12;
  bool stop_and_take_same_bar = 13;
  Decimal cost_pct = 14;      // итоговые издержки сделки, % начального капитала, 2 знака HALF_UP (от рублёвой суммы), core#54
  int64 seq = 15;             // как Fill.seq
}

message BlindStepEvents {
  int64 step = 1;
  repeated BlindBar bars = 2;
  repeated BlindFill fills = 3;
  repeated BlindOrder changed_orders = 4;
  BlindPortfolio portfolio = 5;
}

message BlindCostTotals {
  Decimal commission_pct = 1;
  Decimal exchange_fee_pct = 2;
  Decimal spread_pct = 3;
  Decimal slippage_pct = 4;
  Decimal total_pct = 5;   // % начального капитала от рублёвой суммы издержек, 2 знака HALF_UP (core#54)
}

message BlindEquityPoint {
  int64 step = 1;
  Decimal equity_pct = 2;
}

message BlindRoundTrip {
  int32 instrument_index = 1;
  int64 entry_step = 2;
  int64 exit_step = 3;
  int64 lots = 4;
  Decimal entry_price = 5;
  Decimal exit_price = 6;
  Decimal gross_pnl_pct = 7;
  Decimal costs_pct = 8;
  Decimal net_pnl_pct = 9;
  int64 seq = 10;            // как RoundTrip.seq
}

message BlindReport {
  BlindCostTotals costs = 1;
  repeated BlindEquityPoint equity = 2;
  Decimal final_equity_pct = 3;
  Decimal pnl_pct = 4;
  repeated BlindEquityPoint benchmark_equity = 5;
  repeated BlindRoundTrip round_trips = 6;
  repeated UnderwaterPoint underwater = 7;   // проценты от пика, не рубли: слепой вид их не скрывает
}

message BlindSessionView {
  repeated BlindInstrument instruments = 1;
  repeated BlindStepEvents events = 2;
  repeated BlindBar history = 3;
  BlindPortfolio portfolio = 4;
  repeated BlindOrder orders = 5;
  repeated BlindFill fills = 6;
  BlindReport report = 7;
}

// ---------------------------------------------------------------------------
// Сессия
// ---------------------------------------------------------------------------

message ReplaySessionRequest {
  MarketSpec market = 1;
  repeated JournalEntry journal = 2;
  int64 up_to_step = 3;          // курсор
  int64 events_from_step = 4;    // события шагов (events_from_step; up_to_step]; < 0 — не нужны (события шага 0 не отдаются)
  bool include_history = 5;      // все бары шагов [0; last_step]
  bool include_report = 6;
  reserved 7;
  reserved "stress";
  bool blind = 8;                // добавить слепой вид сессии (рублёвые поля остаются)
}

message ReplaySessionResponse {
  int64 total_steps = 1;
  SessionStatus status = 2;
  int64 last_step = 3;
  repeated StepEvents events = 4;
  repeated Bar history = 5;
  Portfolio portfolio = 6;
  repeated Order orders = 7;
  repeated Fill fills = 8;
  repeated CommandResult command_results = 9;
  Report report = 10;
  int64 warmup_steps = 11;       // шагов прогрева; при include_history бары прогрева идут в history первыми
  BlindSessionView blind_view = 12;
  // Номер торгового дня шага last_step (с 1, как Bar.trading_day), без include_history и include_report (core#54).
  // 0 — шкала пуста. Metrics.trading_days — число дней с точками капитала, то же значение, но только при include_report.
  int32 current_day = 13;
  // Изменение цены бумаг на курсоре для карточек (core#54): по одной записи на бумагу сессии.
  repeated InstrumentChange instrument_changes = 14;
}

message GetBarsRequest {
  MarketSpec market = 1;
  int64 from_step = 2;           // от -warmup_steps (бары прогрева)
  int64 to_step = 3;
  reserved 4;
  reserved "stress";
}

message GetBarsResponse {
  int64 total_steps = 1;
  repeated Bar bars = 2;
  int64 warmup_steps = 3;        // шагов прогрева: допустимый from_step начинается с -warmup_steps
}

message EstimateOrderRequest {
  MarketSpec market = 1;
  repeated JournalEntry journal = 2;
  int64 up_to_step = 3;
  OrderSpec order = 4;
}

message EstimateOrderResponse {
  bool can_place = 1;
  Reason reason = 2;
  string invalid_field = 3;
  Decimal reference_price = 4;      // close последнего бара (шаг <= up_to_step)
  Decimal amount = 5;               // сумма заявки в ₽ (2 знака HALF_UP)
  Decimal commission = 6;           // комиссия брокера в ₽ (2 знака CEILING)
  Decimal exchange_fee = 7;         // биржевой сбор в ₽ (2 знака CEILING)
  // Верхняя граница резерва: округляется вверх до копейки (CEILING, 2 знака)
  // и может отличаться от amount + commission + exchange_fee на копейки.
  Decimal required_cash = 8;
  Decimal amount_pct = 9;           // % от начального капитала (2 знака HALF_UP)
  Decimal commission_pct = 10;      // % от начального капитала (2 знака HALF_UP)
  Decimal exchange_fee_pct = 11;    // % от начального капитала (2 знака HALF_UP)
  Decimal required_cash_pct = 12;   // % от начального капитала (2 знака HALF_UP)
  // Та же заявка в рублях (is_blind_price = false), заполняется когда входная
  // заявка имела is_blind_price = true и перевод выполнен успешно; backend
  // записывает в журнал именно resolved_order.
  OrderSpec resolved_order = 13;
}

enum PeriodCategory {
  PERIOD_CATEGORY_UNSPECIFIED = 0;
  CALM = 1;
  MEDIUM = 2;
  STRESS = 3;
}

// Окно исторического периода для подбора сценариев на стороне backend.
// ВНИМАНИЕ (INV-1, INV-7): клиенту до конца сессии разрешена только категория
// (category). Поля sigma, mdd, start_date и end_date — служебные данные backend
// и не должны передаваться клиенту до завершения сессии (в слепом режиме даты
// окна дополнительно запрещены по INV-7).
message PeriodWindow {
  string start_date = 1;     // ISO yyyy-mm-dd (не передавать клиенту до конца сессии, INV-1/INV-7)
  string end_date = 2;       // ISO yyyy-mm-dd (не передавать клиенту до конца сессии, INV-1/INV-7)
  double sigma = 3;          // годовая реализованная волатильность (только backend, INV-1)
  double mdd = 4;            // максимальная просадка, доля 0..1 (только backend, INV-1)
  PeriodCategory category = 5;
}

message ClassifyPeriodsRequest {
  string snapshot_id = 1;
  int32 window_length = 2;          // длина окна L в торговых днях (>= 3)
  string from_date = 3;             // ISO yyyy-mm-dd, фильтр окон в ответе (включительно); пороги P33/P80 всегда по всему снапшоту
  string to_date = 4;               // ISO yyyy-mm-dd, фильтр окон в ответе (включительно); пороги P33/P80 всегда по всему снапшоту
  optional string start_date = 5;   // «своя дата»: вернуть одно окно с этим началом
  string benchmark_ticker = 6;      // пусто -> "IMOEX"
}

// Ответ классификатора периодов для backend.
// ВНИМАНИЕ (INV-1): пороги p33 и p80, как и sigma/mdd/даты окон в windows,
// не передаются клиенту до конца сессии.
message ClassifyPeriodsResponse {
  repeated PeriodWindow windows = 1;
  double p33 = 2;
  double p80 = 3;
}

// ---------------------------------------------------------------------------
// Стратегии (`dsl.md`): статическая проверка, линтер и параметры
// ---------------------------------------------------------------------------

message ParamValue {
  string name = 1;
  double value = 2;
}

message TextEdit {
  int32 start_line = 1;    // 1-based строка начала замены
  int32 start_column = 2;  // 1-based столбец начала замены
  int32 end_line = 3;      // 1-based строка конца (полуинтервал)
  int32 end_column = 4;    // 1-based столбец конца (полуинтервал)
  string replacement = 5;
}

message DiagnosticFix {
  string description = 1;
  repeated TextEdit edits = 2;
}

message Diagnostic {
  string code = 1;
  Level level = 2;
  int32 start_line = 3;    // 1-based; 0 для ошибок до парсинга или из param_overrides
  int32 start_column = 4;  // 1-based; 0 для ошибок до парсинга или из param_overrides
  int32 end_line = 5;      // 1-based; 0 для ошибок до парсинга или из param_overrides
  int32 end_column = 6;    // 1-based; 0 для ошибок до парсинга или из param_overrides
  string message = 7;
  repeated DiagnosticFix fix = 8;
}

message ParamDecl {
  string name = 1;
  double default_value = 2;
  optional double range_min = 3;
  optional double range_max = 4;
  optional string step = 5; // точный десятичный шаг из исходного текста для UC-16
  bool integer = 6;         // true, если параметр используется в целочисленной позиции (период/смещение)
}

message CheckStrategyRequest {
  string source = 1;
  repeated ParamValue param_overrides = 2;
}

message CheckStrategyResponse {
  Level lookahead_level = 1;
  repeated Diagnostic diagnostics = 2;
  repeated ParamDecl params = 3;
}

message StrategySource {
  string source = 1;
  repeated ParamValue param_overrides = 2;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  COMPLETED = 1;
  BANKRUPT_STOP = 2;
  INVALID = 3;
}

message RunProgress {
  int64 done_steps = 1;
  int64 total_steps = 2;
}

message RunStrategyRequest {
  MarketSpec market = 1;
  StrategySource strategy = 2;
  bool include_history = 3;
}

message RunResult {
  RunStatus status = 1;
  Level level = 2;
  Report report = 3;
  repeated Fill fills = 4;
  repeated Order orders = 5;
  // тег 6 свободен
  fixed64 digest = 7;
  int64 last_step = 8;
  int64 total_steps = 9;
  repeated JournalEntry journal = 10;
  repeated Diagnostic diagnostics = 11;
  repeated Bar history = 12;
}

message RunStrategyUpdate {
  oneof update {
    RunProgress progress = 1;
    RunResult result = 2;
  }
}
