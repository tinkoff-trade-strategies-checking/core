// Контракт gRPC между Java (simulation) и C++ (Simulation Worker).
// Источник правды для обеих сторон. Меняя файл, обнови architecture.md и уведоми backend.
//
// Деньги и цены — Decimal из common.proto (`decisions.md`, «Деньги в C++»); double только в метриках (INV-6).
// Количество — целые лоты. Объём бара — в лотах.
//
// Ошибки RPC:
//   INVALID_ARGUMENT    — неверная спецификация;
//   FAILED_PRECONDITION — нет данных снапшота на период;
//   INTERNAL            — нарушение целостности движка.
//
// Сентинелы: в полях-идентификаторах и шагах «нет» кодируется -1 (значение по умолчанию 0 — валидное: заявка с
// id 0, шаг 0). Так в Order.oco_sibling_id и Order.closed_step; получатель считает «есть» только значение >= 0.
syntax = "proto3";

package pac.simulation.v1;

option java_package = "pac.simulation.v1";
option java_multiple_files = true;

import "common.proto";  // Decimal

service SimulationWorker {
  // Проверка доступности воркера и версии ядра.
  rpc Ping(PingRequest) returns (PingResponse);
  // Воспроизведение сессии по журналу команд до курсора (INV-8).
  rpc ReplaySession(ReplaySessionRequest) returns (ReplaySessionResponse);
  // Бары по диапазону шагов общей шкалы времени сессии.
  rpc GetBars(GetBarsRequest) returns (GetBarsResponse);
}

message PingRequest {}

message PingResponse {
  // Версия Simulation Core, с которой собран воркер.
  string core_version = 1;
}

// ---------------------------------------------------------------------------
// Перечисления
// ---------------------------------------------------------------------------

enum Timeframe {
  TIMEFRAME_UNSPECIFIED = 0;
  S1 = 1;
  S10 = 2;
  M1 = 3;
  M5 = 4;
  M10 = 5;
  M15 = 6;
  H1 = 7;
  D1 = 8;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  MARKET = 1;
  LIMIT = 2;
  STOP = 3;
  STOP_LIMIT = 4;
  TAKE_PROFIT = 5;
  TRAILING_STOP = 6;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  DAY = 1;
  GTC = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  PARTIALLY_FILLED = 2;
  FILLED = 3;
  CANCELLED = 4;
  EXPIRED = 5;
  REJECTED = 6;
}

// Причина отказа в заявке или снятия заявки.
enum Reason {
  REASON_UNSPECIFIED = 0;
  INVALID_PARAMS = 1;
  INSUFFICIENT_CASH = 2;
  INSUFFICIENT_POSITION = 3;
  SESSION_NOT_ACTIVE = 4;
  ORDER_NOT_ACTIVE = 5;
  LIQUIDITY_LIMIT = 6;
  OCO_SIBLING_FILLED = 7;
  reserved 8, 12;
  reserved "POSITION_CLOSED", "RULE_REPLACED";
  REPLACED = 9;
  SESSION_END = 10;
  CANCELLED_BY_USER = 11;
  DAY_EXPIRED = 13;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  RUNNING = 1;
  FINISHED_END = 2;
  BANKRUPT = 3;
}

// ---------------------------------------------------------------------------
// Данные и условия: снапшот, бумаги, период, шаг, издержки, капитал
// ---------------------------------------------------------------------------

message Instrument {
  string key = 1;       // ключ бумаги в сессии
  string ticker = 2;
  int64 lot_size = 3;   // штук в одном лоте
  Decimal price_step = 4;
}

message CostConfig {
  Decimal commission_rate = 1;
  Decimal exchange_fee_rate = 2;
  Decimal spread = 3;
  Decimal slippage_kappa = 4;
  Decimal liquidity_share = 5;
}

message MarketSpec {
  string snapshot_id = 1;               // UUID снапшота ClickHouse
  repeated Instrument instruments = 2;  // порядок = порядок обработки
  Timeframe timeframe = 3;
  string from_date = 4;                 // ISO yyyy-mm-dd, включительно, московская дата
  string to_date = 5;
  CostConfig costs = 6;
  Decimal initial_cash = 7;
  string benchmark_ticker = 8;          // "IMOEX" или пусто
  // Прогрев: столько шагов истории до from_date (0…5000; 0 — без прогрева). Торговли и кривой стоимости на них нет;
  // человек видит их на графике с самого начала (это прошлое, INV-1).
  // Шаги прогрева — отрицательные (-W…-1), торговые дни — <= 0. Историю ищут не дальше ~20 лет до from_date; найдено
  // меньше W баров — берётся сколько есть (фактическое число — warmup_steps в ответах).
  int32 warmup_bars = 10;
  reserved 9;
  reserved "naive";
}

message Bar {
  int64 step = 1;               // номер в общей шкале времени сессии; < 0 — бар прогрева (MarketSpec.warmup_bars)
  string instrument_key = 2;
  int64 time_unix_ms = 3;       // начало бара
  int32 trading_day = 4;        // с 1; у баров прогрева <= 0 (последний день истории — 0)
  Decimal open = 5;
  Decimal high = 6;
  Decimal low = 7;
  Decimal close = 8;
  int64 volume_lots = 9;
  bool after_halt = 10;         // первый бар после разрыва торгов
}

// ---------------------------------------------------------------------------
// Журнал команд (INV-8)
// ---------------------------------------------------------------------------

message OrderSpec {
  string instrument_key = 1;
  Side side = 2;
  OrderType type = 3;
  int64 lots = 4;
  Decimal limit_price = 5;
  Decimal stop_price = 6;
  Decimal trailing_percent = 7;
  TimeInForce time_in_force = 8;
}

message PlaceOrder {
  OrderSpec order = 1;
  OrderSpec oco_with = 2;   // пустой (lots = 0) — без OCO
}

message CancelOrder {
  int64 order_id = 1;
  // Причина снятия: не задана — отмена пользователем (CANCELLED_BY_USER).
  Reason reason = 2;
}

message ReplaceOrder {
  int64 order_id = 1;
  PlaceOrder replacement = 2;
}

message JournalEntry {
  int64 seq = 1;
  int64 step = 2;   // команда действует с шага step + 1 (INV-2)
  oneof command {
    PlaceOrder place = 3;
    CancelOrder cancel = 4;
    ReplaceOrder replace = 5;
  }
  reserved 6, 7;
  reserved "rule_name", "because";
}

// ---------------------------------------------------------------------------
// Состояние
// ---------------------------------------------------------------------------

message Order {
  int64 id = 1;                   // seq * 2 + leg
  OrderSpec spec = 2;
  int64 placed_step = 3;
  OrderStatus status = 4;
  Reason reason = 5;
  string invalid_field = 6;
  int64 filled_lots = 7;
  int64 oco_sibling_id = 8;       // -1 — нет связанной заявки
  reserved 9, 10;
  reserved "rule_name", "because";
  Decimal trailing_stop_level = 11;
  int64 closed_step = 12;         // -1 — заявка ещё открыта
}

message Fill {
  int64 order_id = 1;
  int64 step = 2;
  string instrument_key = 3;
  Side side = 4;
  int64 lots = 5;
  Decimal price = 6;
  Decimal base_price = 7;
  Decimal value = 8;
  Decimal commission = 9;
  Decimal exchange_fee = 10;
  bool stop_and_take_same_bar = 11;   // стоп и тейк в одной свече: сработал стоп, сделка помечена
  Decimal spread_cost = 12;
  Decimal slippage_cost = 13;
}

message Position {
  string instrument_key = 1;
  int64 lots = 2;
  Decimal avg_price = 3;
  Decimal market_value = 4;
}

message Portfolio {
  Decimal cash = 1;
  Decimal equity = 2;
  repeated Position positions = 3;
}

message CommandResult {
  int64 seq = 1;
  bool accepted = 2;
  Reason reason = 3;
  string invalid_field = 4;
  repeated int64 order_ids = 5;
}

message StepEvents {
  int64 step = 1;
  repeated Bar bars = 2;
  repeated Fill fills = 3;
  repeated Order changed_orders = 4;
  Portfolio portfolio = 5;
}

// ---------------------------------------------------------------------------
// Отчёт (ФТ-17). optional — значение может отсутствовать (мало данных).
// ---------------------------------------------------------------------------

message Metrics {
  double total_return = 1;
  double gross_return = 2;
  optional double cagr = 3;
  double max_drawdown = 4;
  int64 max_drawdown_steps = 5;
  optional double volatility = 6;
  optional double sharpe = 7;
  optional double sortino = 8;
  double turnover = 9;
  int64 fills = 10;
  int64 round_trips = 11;
  optional double win_rate = 12;
  int64 rejections = 13;
  int64 partial_fills = 14;
  double hhi_avg = 15;
  double max_position_share = 16;
  optional double benchmark_return = 17;
  int32 trading_days = 18;
  int64 stop_take_same_bar = 19;   // сделок, где стоп и тейк задеты одной свечой (исполнен стоп, INV-3)
}

message CostTotals {
  Decimal commission = 1;
  Decimal exchange_fee = 2;
  Decimal spread = 3;
  Decimal slippage = 4;
}

message EquityPoint {
  int64 step = 1;
  Decimal equity = 2;
}

message Report {
  Metrics metrics = 1;
  CostTotals costs = 2;
  repeated EquityPoint equity = 3;
  reserved 4, 5;
  reserved "findings", "level";
  Decimal final_equity = 6;
  // Кривая бенчмарка (MarketSpec.benchmark_ticker) в рублях того же капитала: initial_cash * close дня / open первого
  // дня, точка на последнем шаге каждого полностью пройденного торгового дня. Пусто без бенчмарка.
  repeated EquityPoint benchmark_equity = 7;
}

// ---------------------------------------------------------------------------
// Сессия
// ---------------------------------------------------------------------------

message ReplaySessionRequest {
  MarketSpec market = 1;
  repeated JournalEntry journal = 2;
  int64 up_to_step = 3;          // курсор
  int64 events_from_step = 4;    // события шагов (events_from_step; up_to_step]; < 0 — не нужны (события шага 0 не отдаются)
  bool include_history = 5;      // все бары шагов [0; last_step]
  bool include_report = 6;
  reserved 7;
  reserved "stress";
}

message ReplaySessionResponse {
  int64 total_steps = 1;
  SessionStatus status = 2;
  int64 last_step = 3;
  repeated StepEvents events = 4;
  repeated Bar history = 5;
  Portfolio portfolio = 6;
  repeated Order orders = 7;
  repeated Fill fills = 8;
  repeated CommandResult command_results = 9;
  Report report = 10;
  int64 warmup_steps = 11;       // шагов прогрева; при include_history бары прогрева идут в history первыми
}

message GetBarsRequest {
  MarketSpec market = 1;
  int64 from_step = 2;           // от -warmup_steps (бары прогрева)
  int64 to_step = 3;
  reserved 4;
  reserved "stress";
}

message GetBarsResponse {
  int64 total_steps = 1;
  repeated Bar bars = 2;
  int64 warmup_steps = 3;        // шагов прогрева: допустимый from_step начинается с -warmup_steps
}
